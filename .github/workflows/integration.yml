name: Integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MB_EMAIL: integration@example.com
      MB_PASSWORD: IntegrationOnly12345!
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build
      - name: Initial Trino ETL
        run: timeout 1200 docker compose wait etl
      - name: Repeat Trino ETL and validate results
        run: docker compose run --rm --no-deps etl
      - name: Save service logs
        if: always()
        run: |
          docker compose ps -a > integration.log
          docker compose logs --no-color >> integration.log 2>&1
          cat integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: integration.log
      - name: Stop services
        if: always()
        run: docker compose down -v
