services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5436:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_start.sql:/docker-entrypoint-initdb.d/01_start.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:8124:8123"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse.sql:/docker-entrypoint-initdb.d/01_start.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "lab", "--password", "lab", "--query", "SELECT 1"]
      interval: 5s
      retries: 30
  load:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: python Scripts/load.py
    environment: {LOAD_MODE: split}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  trino:
    image: trinodb/trino:466
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./trino/catalog:/etc/trino/catalog:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      retries: 30
  etl:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: python Scripts/trino.py
    depends_on:
      trino: {condition: service_healthy}
      load: {condition: service_completed_successfully}
volumes:
  postgres_data:
  clickhouse_data:
